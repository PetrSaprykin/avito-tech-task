services:
  # API сервер
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: avito-tech-server
    ports:
      - "3333:3000" # меняем внешний порт на случай если 300 занят
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - app-network
    restart: unless-stopped

  # Frontend клиент (моё тестовое)
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: avito-tech-client
    ports:
      - "8080:80" # также меняем на случай если 80 занят
    depends_on:
      - server
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
